name: Build and verify comparison update 0.3.135

on:
  push:
    branches: ['main']
    paths: ['docs/releases/app-0.3.135.json', '.github/workflows/comparison-135.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: comparison-135
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/build/android-avds
      CI_SIGNING_KEYSTORE: ${{ github.workspace }}/comparison135-existing.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require exact published catalog and verify comparison logic
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          mkdir -p build/compare135
          /usr/bin/python3 tools/compare135_prepare.py
          for check in test_quick_comparison.py test_updates.py test_java_features.py test_reader_navigation.py test_search.py test_uav_handbook.py test_demz_catalog.py; do
            /usr/bin/python3 -m unittest discover -s tools -p "$check"
          done
      - name: Restore the existing private signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,os,subprocess
          from pathlib import Path
          value=''.join(os.environ.get('ANDROID_DEBUG_KEYSTORE_BASE64','').split())
          if not value: raise SystemExit('Existing signing secret is unavailable; no replacement key is created.')
          key=Path(os.environ['CI_SIGNING_KEYSTORE'])
          key.write_bytes(base64.b64decode(value,validate=True));key.chmod(0o600)
          certificate=subprocess.run(['keytool','-exportcert','-keystore',str(key),'-storepass','android','-alias','androiddebugkey'],check=True,capture_output=True).stdout
          assert hashlib.sha256(certificate).hexdigest()=='2f0a0908f269bc039311edb58fca8863347f1e4c3a7cfaddd909991cf1f0b509'
          print('Existing signing certificate verified')
          PY
      - name: Compile comparison and Android regression tests
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-30;google_apis;x86_64'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon -PciSigningKeystore="$CI_SIGNING_KEYSTORE"
      - name: Preserve catalog channel and obtain exact published fixtures
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/latest/download/latest.json' --output build/compare135/latest-before.json
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/download/app-0.3.134/DLYA_SVOIH_v0.3.134.apk' --output build/compare135/previous-0.3.134.apk
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/download/catalog-197/catalog-197.zip' --output build/compare135/catalog-197.zip
          /usr/bin/python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('build/compare135/previous-0.3.134.apk')
          assert p.stat().st_size==144646769
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='300b77deaee3348e05a0135bf0079414c07dc2e15a7dcfd9b1239a8cef99298f'
          PY
      - name: Prepare disposable accelerated Android 11 device
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name recovery134 --package 'system-images;android-30;google_apis;x86_64' --device pixel_2
      - name: Check comparison and actual signed upgrade at 360 dp
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/run_android_emulator.py --out build/compare135/emulator --timeout 1200 -- bash tools/compare135_android.sh
      - name: Save Android screenshots and build identity for visual review
        run: |
          set -euo pipefail
          mkdir -p research/comparison-135/screens
          cp build/compare135/proof/*.png build/compare135/proof/comparison135-*.xml research/comparison-135/screens/
          cp build/compare135/proof/upgrade-verification.json build/compare135/release/build-result.json research/comparison-135/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/comparison-135/screens research/comparison-135/upgrade-verification.json research/comparison-135/build-result.json
          git commit -m 'Record actual Android comparison and signed upgrade evidence for 0.3.135'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: comparison135-signed-release
          path: build/compare135/release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison135-android-proof
          path: |
            build/compare135/proof/
            build/compare135/reports/
            build/compare135/emulator/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['CI_SIGNING_KEYSTORE']).unlink(missing_ok=True)
          PY
