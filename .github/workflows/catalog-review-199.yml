name: Verify and publish image catalog 199

on:
  push:
    branches: [verify/catalog-199-import]
    paths:
      - .github/workflows/catalog-review-199.yml
      - content/releases/catalog199/**
      - tools/*catalog199*.py
      - test-common/catalog/CatalogReview199Test.kt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-app
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/build/android-avds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reconstruct the exact saved ZIP and verify the public baseline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          mkdir -p build/catalog199 app/src/androidTest/assets
          git fetch --depth=1 origin 17afade25fcaea88fdd50e0e936bfaa17b0da4c6
          git diff --exit-code 17afade25fcaea88fdd50e0e936bfaa17b0da4c6 -- app/src/main content/catalog.json
          python3 tools/restore_catalog199_candidate.py --output build/catalog199/catalog-199.zip
          curl --fail --silent --show-error --location --retry 3 --max-time 180 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/download/catalog-198/catalog-198.zip' --output build/catalog199/public-198.zip
          /usr/bin/python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          request=json.loads(Path('docs/releases/catalog-review-198.json').read_text())
          with zipfile.ZipFile('build/catalog199/public-198.zip') as z:
              db=z.read('guide.db')
              assert hashlib.sha256(db).hexdigest()==request['databaseSha256']
              assert db==Path('app/src/main/assets/database/guide-v29.db').read_bytes()
              Path('app/src/androidTest/assets/review199-baseline.db').write_bytes(db)
          PY
          /usr/bin/python3 tools/verify_catalog199.py --pack build/catalog199/catalog-199.zip --baseline app/src/androidTest/assets/review199-baseline.db --output build/catalog199
          cp build/catalog199/catalog-199.zip app/src/androidTest/assets/review199-pack.zip
          cp build/catalog199/image-fixtures.json app/src/androidTest/assets/review199-images.json
          cp test-common/catalog/CatalogReview199Test.kt app/src/androidTest/java/ru/dlyasvoih/app/
      - name: Verify import code, media, migration and Android proof gate
        run: |
          set -euo pipefail
          for check in test_catalog199_android_proof.py test_catalog_android_limits.py test_updates.py test_java_features.py test_search.py; do
            /usr/bin/python3 -m unittest discover -s tools -p "$check"
          done
          curl --fail --silent --show-error --location --retry 3 --max-time 90 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/latest/download/latest.json' --output build/catalog199/latest-before.json
          python3 tools/prepare_catalog199_release.py --output build/catalog199 --previous-feed build/catalog199/latest-before.json
      - name: Compile production importer tests and prepare Android 11
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-30;google_apis;x86_64'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          python3 tools/prepare_optional_models139.py
          bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name recovery134 --package 'system-images;android-30;google_apis;x86_64' --device pixel_2
      - name: Import 198 to 199, preserve user data and reject invalid imports
        run: |
          set -euo pipefail
          python3 tools/run_android_emulator.py --out build/catalog199/emulator --timeout 1200 -- bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.dlyasvoih.app.CatalogReview199Test --no-daemon
          python3 tools/verify_catalog199_android.py --reports app/build/outputs/androidTest-results/connected/debug --output build/catalog199/android-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog199-release-and-android-proof
          path: |
            build/catalog199/
            app/build/outputs/androidTest-results/connected/debug/
          retention-days: 30

  publish:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: catalog199-release-and-android-proof
          path: .
      - name: Verify uploaded bytes before opening the catalog update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: sanozhukov3737-oss/dlya-svoih-updates
        run: |
          set -euo pipefail
          python3 tools/verify_catalog199_android.py --reports app/build/outputs/androidTest-results/connected/debug --output build/catalog199/android-verification.json
          curl --fail --silent --show-error --location --retry 3 --max-time 90 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/latest/download/latest.json' --output build/catalog199/latest-at-publish.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path('build/catalog199')
          before=json.loads((out/'latest-before.json').read_text())
          now=json.loads((out/'latest-at-publish.json').read_text())
          feed=json.loads((out/'latest.json').read_text())
          assert now==before, 'Update channel changed during testing'
          assert now['contentVersion']==198 and feed['contentVersion']==199
          assert feed['app']==now['app']
          assert feed['sha256']=='e4cd470d909f851a89a4eff90dffb7e7bbe24a7573ee575cb59d2b49c9c64a09'
          assert hashlib.sha256((out/'catalog-199.zip').read_bytes()).hexdigest()==feed['sha256']
          assert (out/'catalog-199.zip').stat().st_size==feed['bytes']==145570775
          with (out/'notes.txt').open('a') as stream:
              stream.write('\nПроверено на Android 11: импорт фактического ZIP 198 → 199, сохранение всех 2855 ID/rowid, избранного и всех полей места чтения после повторного открытия. Декодированы все 86 новых изображений. Повторная установка и неверно объявленная версия отклонены без изменения данных. Все три теста прошли без ошибок и пропусков.\n')
          PY
          gh release create catalog-199 build/catalog199/catalog-199.zip build/catalog199/latest.json build/catalog199/package-verification.json build/catalog199/android-verification.json --draft --target "$GITHUB_SHA" --title 'ДЛЯ СВОИХ — каталог №199' --notes-file build/catalog199/notes.txt
          mkdir -p build/catalog199/download-check
          gh release download catalog-199 --pattern catalog-199.zip --pattern latest.json --dir build/catalog199/download-check
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path('build/catalog199'); check=out/'download-check'
          feed=json.loads((check/'latest.json').read_text())
          pack=check/'catalog-199.zip'
          assert hashlib.sha256(pack.read_bytes()).hexdigest()==feed['sha256']
          assert pack.stat().st_size==feed['bytes']
          assert pack.read_bytes()==(out/'catalog-199.zip').read_bytes()
          assert (check/'latest.json').read_bytes()==(out/'latest.json').read_bytes()
          PY
          gh release edit catalog-199 --draft=false --latest
