name: Verify and collect all Android model frames 0.3.138
on:
  push:
    branches: ['verify/models-0.3.138']
    paths: ['.github/workflows/models-138-rerender.yml', 'tools/render_models138.py', 'app/src/androidTest/java/ru/dlyasvoih/app/ui/screens/Collection138RenderTest.kt']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test-capture-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI_SIGNING_KEYSTORE: ${{ github.workspace }}/models138-existing.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing test signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYKEY'
          import base64,hashlib,os,subprocess
          from pathlib import Path
          p=Path(os.environ['CI_SIGNING_KEYSTORE'])
          p.write_bytes(base64.b64decode(''.join(os.environ['ANDROID_DEBUG_KEYSTORE_BASE64'].split()),validate=True));p.chmod(0o600)
          cert=subprocess.run(['keytool','-exportcert','-keystore',str(p),'-storepass','android','-alias','androiddebugkey'],check=True,capture_output=True).stdout
          assert hashlib.sha256(cert).hexdigest()=='2f0a0908f269bc039311edb58fca8863347f1e4c3a7cfaddd909991cf1f0b509'
          PYKEY
      - name: Compile corrected capture test only
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          # This job produces only the instrumentation APK; the tested app is the pinned 615-model APK.
          bash ./gradlew :app:assembleDebugAndroidTest -x :app:preBuild --no-daemon --max-workers=2 -PciSigningKeystore="$CI_SIGNING_KEYSTORE"
          mkdir -p build/capture-test
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/capture-test/test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: models138-capture-test
          path: build/capture-test/test.apk
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: python3 -c "import os,pathlib;pathlib.Path(os.environ['CI_SIGNING_KEYSTORE']).unlink(missing_ok=True)"
  render:
    needs: test-capture-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/build/android-avds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: models138-apks
          run-id: 40476564246
          github-token: ${{ github.token }}
          path: build/models138/apks
      - uses: actions/download-artifact@v4
        with:
          name: models138-capture-test
          path: build/models138/apks
      - name: Prepare accelerated Android device
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-30;google_apis;x86_64'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name recovery134 --package 'system-images;android-30;google_apis;x86_64' --device pixel_2
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['ANDROID_AVD_HOME'])/'recovery134.avd/config.ini'
          values=dict(line.split('=',1) for line in p.read_text().splitlines() if '=' in line)
          values.update({'hw.lcd.width':'720','hw.lcd.height':'1280','hw.lcd.density':'320','disk.dataPartition.size':'8G'})
          p.write_text('\n'.join(k+'='+v for k,v in values.items())+'\n')
          PY
      - name: Render and rotate every assigned model without network
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/run_android_emulator.py --out build/models138/emulator --timeout 1800 -- /usr/bin/python3 tools/render_models138.py --shard ${{ matrix.shard }} --shards 8 --apks build/models138/apks --out build/models138/proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: models138-render-${{ matrix.shard }}
          path: |
            build/models138/proof/
            build/models138/emulator/
          if-no-files-found: error
          retention-days: 14
