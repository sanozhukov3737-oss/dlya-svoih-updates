name: Verify and publish reviewed PDF catalog 198

on:
  push:
    branches: [main]
    paths: [docs/releases/catalog-review-198.json, .github/workflows/catalog-review-198.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-app
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/build/android-avds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify exact reviewed snapshot and public baseline
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          mkdir -p build/catalog198 app/src/androidTest/assets
          git fetch --depth=1 origin 849924c143c960ced730b314e95758eb3729edf7
          git show 849924c143c960ced730b314e95758eb3729edf7:app/src/main/assets/database/guide-v29.db > app/src/androidTest/assets/review198-baseline.db
          cp test-common/catalog/CatalogReview198Test.kt app/src/androidTest/java/ru/dlyasvoih/app/
          git diff --exit-code 849924c143c960ced730b314e95758eb3729edf7 -- app/src/main/assets/viewer3d app/src/main/java
          /usr/bin/python3 - <<'PY'
          import hashlib,json,sqlite3,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from build_catalog import validate
          request=json.loads(Path('docs/releases/catalog-review-198.json').read_text())
          for path,key in [('content/catalog.json','catalogSha256'),('app/src/main/assets/database/guide-v29.db','databaseSha256')]:
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==request[key], path
          validate(json.loads(Path('content/catalog.json').read_text()))
          with sqlite3.connect('app/src/androidTest/assets/review198-baseline.db') as db:
              assert db.execute("SELECT value FROM metadata WHERE key='content_version'").fetchone()==('197',)
              assert db.execute('SELECT count(*) FROM cards').fetchone()==(1695,)
          PY
      - name: Check Android import limits, migrations, media and search
        run: |
          set -euo pipefail
          for check in test_catalog_android_limits.py test_updates.py test_uav_handbook.py test_demz_catalog.py test_java_features.py test_reader_navigation.py test_search.py; do
            /usr/bin/python3 -m unittest discover -s tools -p "$check"
          done
      - name: Build actual release ZIP and preserve APK offer
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 90 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/latest/download/latest.json' --output build/catalog198/latest-before.json
          /usr/bin/python3 tools/prepare_pdf_release_198.py --request docs/releases/catalog-review-198.json --previous-feed build/catalog198/latest-before.json --output build/catalog198
          cp build/catalog198/catalog-198.zip app/src/androidTest/assets/review198-pack.zip
      - name: Compile importer tests and prepare Android 11
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-30;google_apis;x86_64'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          python3 tools/prepare_optional_models139.py
          bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name recovery134 --package 'system-images;android-30;google_apis;x86_64' --device pixel_2
      - name: Import 197 to 198, retain favorites and reject a repeat import
        run: |
          set -euo pipefail
          python3 tools/run_android_emulator.py --out build/catalog198/emulator --timeout 900 -- bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.dlyasvoih.app.CatalogReview198Test --no-daemon
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected/debug').glob('TEST-*.xml'))
          assert files, 'Missing Android reports'
          suites=[ET.parse(p).getroot() for p in files]
          tests=sum(int(s.attrib['tests']) for s in suites)
          assert tests==2
          assert sum(int(s.attrib.get(k,0)) for s in suites for k in ('failures','errors','skipped'))==0
          proof=dict(androidApi=30,androidVersion='11',tests=tests,failures=0,
                     actualReleaseZipImported=True,stablePreviousIdentities=1695,
                     finalCards=2855,finalImages=2317,favoritesAndReadingPreserved=True,
                     mediaDecodedOnAndroid=True,repeatImportRejected=True)
          Path('build/catalog198/android-verification.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog198-release-and-android-proof
          path: |
            build/catalog198/
            app/build/outputs/androidTest-results/connected/debug/
          retention-days: 30

  publish:
    needs: catalog
    if: ${{ needs.catalog.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: catalog198-release-and-android-proof
          path: .
      - name: Upload, verify and open catalog update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: sanozhukov3737-oss/dlya-svoih-updates
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 90 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/latest/download/latest.json' --output build/catalog198/latest-at-publish.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('build/catalog198')
          previous=json.loads((out/'latest-before.json').read_text())
          latest=json.loads((out/'latest-at-publish.json').read_text())
          assert latest['contentVersion']<198, 'A newer catalog is already published'
          assert latest['app']==previous['app'], 'APK offer changed during testing'
          with (out/'notes.txt').open('a') as f:
              f.write('\nПроверено на Android 11: импорт фактического ZIP поверх каталога 197, сохранение всех 1695 прежних ID и rowid, избранного и места чтения после повторного открытия, декодирование изображений и отклонение повторной установки. В итоге 2855 карточек и 2317 изображений. Предложение APK и пакет 3D-моделей сохранены.\n')
          PY
          gh release create catalog-198 build/catalog198/catalog-198.zip build/catalog198/latest.json build/catalog198/package-verification.json build/catalog198/android-verification.json --draft --target "$GITHUB_SHA" --title 'ДЛЯ СВОИХ — каталог №198' --notes-file build/catalog198/notes.txt
          mkdir -p build/catalog198/download-check
          gh release download catalog-198 --pattern catalog-198.zip --pattern latest.json --dir build/catalog198/download-check
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path('build/catalog198'); check=out/'download-check'
          feed=json.loads((check/'latest.json').read_text())
          pack=check/'catalog-198.zip'
          assert pack.read_bytes()==(out/'catalog-198.zip').read_bytes()
          assert pack.stat().st_size==feed['bytes']
          assert hashlib.sha256(pack.read_bytes()).hexdigest()==feed['sha256']
          assert (check/'latest.json').read_bytes()==(out/'latest.json').read_bytes()
          assert feed['app']==json.loads((out/'latest-before.json').read_text())['app']
          PY
          gh release edit catalog-198 --draft=false --latest
