name: Prepare RuStore release

on:
  workflow_dispatch:
    inputs:
      initialize_signing:
        description: 'Create the permanent store key only for its first build'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: rustore-preparation
  cancel-in-progress: false

jobs:
  rustore:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed source bundle
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path,PurePosixPath
          bundle=Path('rustore-source-patch.zip')
          assert hashlib.sha256(bundle.read_bytes()).hexdigest()=='4a96528dafae7b2fd572fe8090431a85e990ddb8a4a7be5e364de2722d1a8348'
          with zipfile.ZipFile(bundle) as z:
              files=json.loads(z.read('manifest.json'))['files']
              assert set(z.namelist())=={'manifest.json'}|{f['path'] for f in files}
              for f in files:
                  p=PurePosixPath(f['path']);assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in ('app','tools','docs') and not p.suffix in ('.jks','.keystore')
                  data=z.read(f['path']);assert len(data)==f['bytes'] and hashlib.sha256(data).hexdigest()==f['sha256']
                  target=Path(f['path']);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install validation dependencies and restore catalog 189
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil python3-cryptography
          /usr/bin/python3 tools/restore_packaged_catalog.py
      - name: Persist reviewed source in preparation branch
        run: |
          python3 - <<'PY'
          import json,zipfile,subprocess,hashlib
          from pathlib import Path
          with zipfile.ZipFile('rustore-source-patch.zip') as z:files=[f['path'] for f in json.loads(z.read('manifest.json'))['files']]
          subprocess.run(['git','add','--',*files],check=True)
          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(Path(p).read_bytes()).hexdigest()+'  '+p+'\n' for p in sorted(tracked) if p!='SHA256SUMS.txt' and Path(p).is_file()))
          subprocess.run(['git','add','SHA256SUMS.txt'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Apply reviewed RuStore channel and signing preparation'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Validate handbook and compile store channel
        run: |
          /usr/bin/python3 -m unittest discover -s tools -p 'test_catalog_189.py'
          /usr/bin/python3 -m unittest discover -s tools -p 'test_menu_images.py'
          /usr/bin/python3 -m unittest discover -s tools -p 'test_reader_navigation.py'
          /usr/bin/python3 -m unittest discover -s tools -p 'test_quick_comparison.py'
          /usr/bin/python3 -m unittest discover -s tools -p 'test_java_features.py'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon -PrustoreBuild=true
          test -s app/build/outputs/mapping/release/mapping.txt
      - name: Sign with permanent certificate and proof of rotation
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          INITIALIZE_SIGNING: ${{ inputs.initialize_signing }}
        run: |
          args=()
          if [ "$INITIALIZE_SIGNING" = 'true' ]; then args+=(--initialize-signing); fi
          /usr/bin/python3 tools/sign_rustore.py --apk app/build/outputs/apk/release/app-release-unsigned.apk --output build/rustore "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: rustore-signing-backup
          path: |
            build/rustore/rustore-release-key.enc
            build/rustore/rustore-signing.json
            build/rustore/rustore-release-cert.der
            build/rustore/rustore-signing-lineage.bin
          if-no-files-found: error
          retention-days: 90
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check store APK migration and capture real Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash ./gradlew :app:connectedDebugAndroidTest --no-daemon -PrustoreBuild=true -Pandroid.testInstrumentationRunnerArguments.class=ru.dlyasvoih.app.ui.screens.CardReaderPagesTest,ru.dlyasvoih.app.ui.screens.ComparisonSheetTest,ru.dlyasvoih.app.ui.screens.CatalogMenuIconTest,ru.dlyasvoih.app.PackagedDatabaseTest
            /usr/bin/python3 tools/check_rustore_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustore-prepared-app
          path: |
            build/rustore/DLYA_SVOIH_v0.3.126_RUSTORE.apk
            build/rustore/screenshots/*.png
            build/rustore/rustore-signing.json
            build/rustore/signature-verification.txt
            build/rustore/android-migration-check.json
            build/rustore/release-crash.log
            app/build/reports/androidTests/connected/debug
          if-no-files-found: warn
          retention-days: 90
