name: Prepare RuStore release

on:
  workflow_dispatch:
    inputs:
      initialize_signing:
        description: 'Create the permanent store key only for its first build'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: rustore-preparation
  cancel-in-progress: false

jobs:
  rustore:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install validation dependencies and restore catalog 189
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil python3-cryptography
          /usr/bin/python3 tools/restore_packaged_catalog.py
      - name: Validate handbook and compile store channel
        run: |
          /usr/bin/python3 -m unittest discover -s tools -p 'test_catalog_189.py'
          /usr/bin/python3 -m unittest discover -s tools -p 'test_menu_images.py'
          /usr/bin/python3 -m unittest discover -s tools -p 'test_reader_navigation.py'
          /usr/bin/python3 -m unittest discover -s tools -p 'test_quick_comparison.py'
          /usr/bin/python3 -m unittest discover -s tools -p 'test_java_features.py'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon -PrustoreBuild=true
          test -s app/build/outputs/mapping/release/mapping.txt
      - name: Reuse the existing encrypted signing artifact
        uses: actions/download-artifact@v4
        with:
          name: rustore-signing-backup
          run-id: 38142894573
          github-token: ${{ github.token }}
          path: docs/releases
      - name: Verify retained public signing identity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('docs/releases/rustore-signing.json').read_text())['signerSha256']=='0681253f0552175888aca4278977703241c5bbce528a425f7fa23a63020904f9'
          PY
      - name: Sign with permanent certificate and proof of rotation
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          INITIALIZE_SIGNING: ${{ inputs.initialize_signing }}
        run: |
          args=()
          if [ "$INITIALIZE_SIGNING" = 'true' ]; then args+=(--initialize-signing); fi
          /usr/bin/python3 tools/sign_rustore.py --apk app/build/outputs/apk/release/app-release-unsigned.apk --output build/rustore "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: rustore-signing-backup
          path: |
            build/rustore/rustore-release-key.enc
            build/rustore/rustore-signing.json
            build/rustore/rustore-release-cert.der
            build/rustore/rustore-signing-lineage.bin
          if-no-files-found: error
          retention-days: 90
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check store APK migration and capture real Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash ./gradlew :app:connectedDebugAndroidTest --no-daemon -PrustoreBuild=true -Pandroid.testInstrumentationRunnerArguments.class=ru.dlyasvoih.app.ui.screens.CardReaderPagesTest,ru.dlyasvoih.app.ui.screens.ComparisonSheetTest,ru.dlyasvoih.app.ui.screens.CatalogMenuIconTest,ru.dlyasvoih.app.PackagedDatabaseTest
            /usr/bin/python3 tools/check_rustore_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustore-prepared-app
          path: |
            build/rustore/DLYA_SVOIH_v0.3.126_RUSTORE.apk
            build/rustore/screenshots/*.png
            build/rustore/rustore-signing.json
            build/rustore/signature-verification.txt
            build/rustore/android-migration-check.json
            build/rustore/release-crash.log
            app/build/reports/androidTests/connected/debug
          if-no-files-found: warn
          retention-days: 90
