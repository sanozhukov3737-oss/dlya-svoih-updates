name: Build and publish APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty for app-VERSION)'
        required: false
        type: string
      changes:
        description: 'What changed in this version'
        required: true
        type: string
      reuse_apk:
        description: 'Reuse the already built 0.3.128 APK for this verification run'
        type: boolean
        default: false
      proof_only:
        description: 'Run Android visual proof without publishing an APK'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-app
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_SIGNING_KEYSTORE: ${{ github.workspace }}/dlya-svoih-debug.keystore
    steps:
      - uses: actions/checkout@v4
      - name: Use actual release pixels for viewport verification
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          p = Path('app/src/androidTest/java/ru/dlyasvoih/app/ui/screens/OfflineModelViewerTest.kt')
          s = p.read_text()
          lines = s.splitlines(keepends=True)
          updated = ''.join(line for line in lines if 'Math.abs(document.getElementById' not in line)
          if updated != s:
              p.write_text(updated)
              subprocess.run(['git', 'add', str(p)], check=True)
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'commit', '-m', 'Validate visible viewport through the actual release UI'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:offline-3d-0.3.127'], check=True)
          PYCODE
      - name: Restore published catalog 190 into APK assets
        run: python3 tools/restore_packaged_catalog.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the same debug signing key as the installed app
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = ''.join(os.environ.get('ANDROID_DEBUG_KEYSTORE_BASE64', '').split())
          if not value:
              raise SystemExit('Add the ANDROID_DEBUG_KEYSTORE_BASE64 Actions secret from your build PC first.')
          path = Path(os.environ['CI_SIGNING_KEYSTORE'])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
          python3 - <<'PY'
          import hashlib, os, subprocess
          certificate = subprocess.run(['keytool', '-exportcert', '-keystore', os.environ['CI_SIGNING_KEYSTORE'],
              '-storepass', 'android', '-alias', 'androiddebugkey'], capture_output=True, check=True).stdout
          print('Restored signing certificate SHA-256:', hashlib.sha256(certificate).hexdigest(), flush=True)
          PY
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Check reader behavior and compile Android regression tests
        run: |
          python3 -m unittest discover -s tools -p 'test_offline_model.py'
          python3 -m unittest discover -s tools -p 'test_menu_images.py'
          python3 -m unittest discover -s tools -p 'test_reader_navigation.py'
          python3 -m unittest discover -s tools -p 'test_quick_comparison.py'
          python3 -m unittest discover -s tools -p 'test_java_features.py'
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest --no-daemon -PciSigningKeystore="$CI_SIGNING_KEYSTORE"
      - name: Build or reuse APK
        if: ${{ !inputs.proof_only }}
        id: build-apk
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_APK: ${{ inputs.reuse_apk }}
        run: |
          if [ "$REUSE_APK" = "true" ]; then
            gh run download 39062754299 --name apk-and-update-feed --dir build/reused
            mkdir -p app/build/outputs/apk/release app/build/outputs/mapping/release
            cp build/reused/app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release.apk
            cp build/reused/app/build/outputs/mapping/release/mapping.txt app/build/outputs/mapping/release/mapping.txt
            python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              for name in ('index.html', 'viewer.bundle.js', 'tm-46.glb', 'model-credits.json'):
                  path = 'assets/viewer3d/' + name
                  assert apk.read(path) == Path('app/src/main/' + path).read_bytes(), path
          PY
            test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name app/build/outputs/apk/release/app-release.apk)" = "0.3.128"
          else
            bash ./gradlew :app:assembleRelease --no-daemon -PciSigningKeystore="$CI_SIGNING_KEYSTORE"
          fi
          test -s app/build/outputs/mapping/release/mapping.txt
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable app/build/outputs/apk/release/app-release.apk)" = "false"
      - name: Prepare real release visual verification
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          mkdir -p build
          cat > build/verify-release-ui.py <<'PY'
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path
          
          out = Path('build')
          
          def adb(*args):
              return subprocess.run(['adb', *args], capture_output=True, check=True).stdout
          
          def tree():
              raw = adb('shell', 'uiautomator', 'dump', '/sdcard/offline-proof.xml')
              raw = adb('exec-out', 'cat', '/sdcard/offline-proof.xml')
              (out / 'release-ui.xml').write_bytes(raw)
              return ET.fromstring(raw)
          
          def tap(node):
              x1, y1, x2, y2 = map(int, re.findall(r'\d+', node.attrib['bounds']))
              adb('shell', 'input', 'tap', str((x1+x2)//2), str((y1+y2)//2))
          
          def find(predicate, timeout=25, scroll=False):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  root = tree()
                  for node in root.iter('node'):
                      if predicate(node.attrib):
                          return node
                  if scroll:
                      adb('shell', 'input', 'swipe', '160', '490', '160', '180', '350')
                  time.sleep(.6)
              texts = [n.attrib.get('text') or n.attrib.get('content-desc') for n in root.iter('node')]
              raise AssertionError('UI element missing: ' + repr([t for t in texts if t]))
          
          try:
              adb('shell', 'am', 'start', '-W', '-n', 'ru.dlyasvoih.app/.MainActivity', '--es', 'shortcut_route', 'search_tab')
              search = find(lambda a: a.get('class') == 'android.widget.EditText')
              tap(search)
              adb('shell', 'input', 'text', '46')
              adb('shell', 'input', 'keyevent', '4')
              categories = find(lambda a: a.get('text') == 'Все категории' or a.get('resource-id', '').endswith('category_filter'))
              tap(categories)
              category = find(lambda a: a.get('text') == 'Противотанковые мины', timeout=45, scroll=True)
              tap(category)
              card = find(lambda a: a.get('text') == 'ТМ-46' or a.get('content-desc') == 'ТМ-46', timeout=80, scroll=True)
              tap(card)
              button = find(lambda a: '3D-модель' in (a.get('text', '') + a.get('content-desc', '')), scroll=True)
              tap(button)
              time.sleep(5)
              root = tree()
              print('REAL RELEASE VIEWER TEXT:', [(n.attrib.get('text'), n.attrib.get('content-desc')) for n in root.iter('node') if n.attrib.get('text') or n.attrib.get('content-desc')], flush=True)
              (out / 'offline-model-release.png').write_bytes(adb('exec-out', 'screencap', '-p'))
              from PIL import Image, ImageChops
              image = Image.open(out / 'offline-model-release.png').convert('RGB')
              w, h = image.size
              region = (int(w*.15), int(h*.30), int(w*.85), int(h*.70))
              pixels = list(image.crop(region).getdata())
              visible = sum(max(abs(r-19), abs(g-26), abs(b-23)) > 35 for r,g,b in pixels)
              assert visible > 500 and len(set(pixels)) > 100, f'Model pixels are missing: {visible}, colors={len(set(pixels))}'
              adb('shell', 'input', 'swipe', '90', '290', '230', '330', '700')
              time.sleep(1)
              (out / 'offline-model-release-rotated.png').write_bytes(adb('exec-out', 'screencap', '-p'))
              rotated = Image.open(out / 'offline-model-release-rotated.png').convert('RGB')
              assert ImageChops.difference(image, rotated).crop(region).getbbox(), 'Rotation did not change the visible model'
              print('Actual model pixels and touch rotation verified', visible, flush=True)
          finally:
              (out / 'release-last-screen.png').write_bytes(adb('exec-out', 'screencap', '-p'))
          PY
      - name: Load published APK for proof-only run
        if: ${{ inputs.proof_only }}
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request
          from pathlib import Path
          import json
          feed_url = 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/latest/download/latest.json'
          with urllib.request.urlopen(feed_url, timeout=30) as response:
              app = json.load(response)['app']
          assert app['url'].startswith('https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/download/app-')
          with urllib.request.urlopen(app['url'], timeout=120) as response:
              data = response.read()
          assert len(data) == app['bytes']
          assert hashlib.sha256(data).hexdigest() == app['sha256']
          path = Path('app/build/outputs/apk/release/app-release.apk')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise reader and packaged database on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: false
          script: |
            mkdir -p build
            bash ./gradlew :app:connectedDebugAndroidTest --no-daemon -PciSigningKeystore="$CI_SIGNING_KEYSTORE" -Pandroid.testInstrumentationRunnerArguments.class=ru.dlyasvoih.app.ui.screens.CardReaderPagesTest,ru.dlyasvoih.app.ui.screens.ComparisonSheetTest,ru.dlyasvoih.app.ui.screens.CatalogMenuIconTest,ru.dlyasvoih.app.ui.screens.OfflineModelViewerTest,ru.dlyasvoih.app.PackagedDatabaseTest || true
            adb pull /data/local/tmp/offline-model-tm46.png build/offline-model-tm46.png || true
            adb logcat -c
            adb install -r app/build/outputs/apk/release/app-release.apk
            python3 build/verify-release-ui.py
            python3 -c "from pathlib import Path; assert 'ru.dlyasvoih.app' in Path('build/release-ui.xml').read_text(), 'Release UI did not open'"
            adb logcat -d -b crash > build/release-crash.log
            python3 -c "from pathlib import Path; log = Path('build/release-crash.log').read_text(); assert 'FATAL EXCEPTION' not in log and 'Fatal signal' not in log, log"
      - name: Require all Android instrumentation checks to pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/outputs/androidTest-results/connected/debug').glob('TEST-*.xml'))
          assert reports, 'Android test reports are missing'
          suites = [ET.parse(path).getroot() for path in reports]
          assert sum(int(s.attrib['tests']) for s in suites) >= 22
          assert sum(int(s.attrib.get('failures', 0)) + int(s.attrib.get('errors', 0)) + int(s.attrib.get('skipped', 0)) for s in suites) == 0
          PY
      - name: Upload Android visual proof
        uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: offline-3d-visual-proof
          path: |
            build/offline-model*.png
            build/release-last-screen.png
            build/release-ui.xml
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected/debug
          if-no-files-found: warn
      - name: Prepare versioned APK and preserve published catalog
        if: ${{ !inputs.proof_only }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANGES: ${{ inputs.changes }}
        run: |
          mkdir -p build/release
          python3 - <<'PY'
          import os, re, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from build_app_feed import apk_metadata, write_app_feed
          apk = Path('app/build/outputs/apk/release/app-release.apk')
          # Use the exact Build Tools version installed above, not a newer runner tool.
          signer = str(Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner')
          analyzer = str(Path(os.environ['ANDROID_HOME']) / 'cmdline-tools/latest/bin/apkanalyzer')
          metadata = apk_metadata(apk, analyzer=analyzer, signer=signer)
          print('Built APK identity:', metadata, flush=True)
          tag = os.environ.get('RELEASE_TAG') or 'app-' + metadata['versionName']
          if not re.fullmatch(r'app-[a-zA-Z0-9._-]+', tag):
              raise SystemExit('Use a unique tag beginning with app-, for example app-0.3.114')
          base = Path('build/release')
          name = 'DLYA_SVOIH_v' + metadata['versionName'] + '.apk'
          if not re.fullmatch(r'DLYA_SVOIH_v[0-9A-Za-z._-]+\.apk', name):
              raise SystemExit('Invalid APK version name')
          target = base / name
          target.write_bytes(apk.read_bytes())
          address = 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/latest/download/latest.json'
          with urllib.request.urlopen(address, timeout=30) as response:
              data = response.read(65537)
          if len(data) > 65536:
              raise SystemExit('Published feed exceeds limits')
          previous = base / 'latest-before.json'
          previous.write_bytes(data)
          changes = os.environ['RELEASE_CHANGES']
          write_app_feed(target, previous,
              'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/download/' + tag + '/' + name,
              base / 'latest.json', changes, analyzer=analyzer, signer=signer,
              repair_initial_publication=True)
          (base / 'tag.txt').write_text(tag, encoding='utf-8')
          (base / 'notes.txt').write_text(changes, encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() && steps.build-apk.outcome == 'success' }}
        with:
          name: apk-and-update-feed
          path: |
            app/build/outputs/apk/release/app-release.apk
            build/release/latest.json
            build/release-ui.xml
            build/offline-model*.png
            build/release-last-screen.png
            build/release-ui.xml
            build/release-crash.log
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected/debug
          if-no-files-found: error
      - name: Publish only after both files are uploaded
        if: ${{ !inputs.proof_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="$(cat build/release/tag.txt)"
          gh release create "$RELEASE_TAG" build/release/*.apk build/release/latest.json --target "$(git rev-parse HEAD)" --draft --title "$RELEASE_TAG" --notes-file build/release/notes.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['CI_SIGNING_KEYSTORE']).unlink(missing_ok=True)
          PY
