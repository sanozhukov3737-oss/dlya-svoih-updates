name: Prepare reviewed PDF references for catalog 198
on:
  push:
    branches: [content/pdf-review-20261028]
    paths: [content/inputs/pdf198-assets-manifest.json]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install image validation dependency
        run: sudo apt-get update -qq && sudo apt-get install -y python3-pil
      - name: Restore pinned exterior assets and build catalog
        run: |
          /usr/bin/python3 tools/materialize_pdf_assets_198.py
          /usr/bin/python3 tools/apply_pdf_import_198.py --output build/pdf-import-198/catalog.json
          /usr/bin/python3 tools/build_catalog.py --source build/pdf-import-198/catalog.json --output build/pdf-import-198/guide-v29.db
          /usr/bin/python3 tools/verify_pdf_import_198.py --catalog build/pdf-import-198/catalog.json --database build/pdf-import-198/guide-v29.db --report research/pdf-import-20261028/validation.json
      - name: Commit prepared data without publishing
        run: |
          cp build/pdf-import-198/catalog.json content/catalog.json
          cp build/pdf-import-198/guide-v29.db app/src/main/assets/database/guide-v29.db
          cp build/pdf-import-198/content-version.txt app/src/main/assets/database/content-version.txt
          git add content/catalog.json app/src/main/assets/images/pdf198-* app/src/main/assets/thumbs/pdf198-* app/src/main/assets/database/guide-v29.db app/src/main/assets/database/content-version.txt research/pdf-import-20261028/validation.json
          git rm content/inputs/pdf198-assets.zip.part*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize reviewed PDF references and catalog 198 database [skip ci]'
          git push origin HEAD:content/pdf-review-20261028
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-import-198-validation
          path: research/pdf-import-20261028/validation.json
