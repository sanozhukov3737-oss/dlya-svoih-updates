name: Check published 0.3.135 on Android 8 and 16

on:
  push:
    branches: ['main']
    paths: ['docs/releases/published-135-compat.json', '.github/workflows/published-135-compat.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-135-compat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/build/android-avds
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify the unchanged public APK
        run: |
          set -euo pipefail
          mkdir -p build/compat135
          curl --fail --silent --show-error --location --retry 2 --max-time 180 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/download/app-0.3.135/DLYA_SVOIH_v0.3.135.apk' --output build/compat135/public.apk
          echo '068b71392f570ad768b59c391c10dbba8f9f90dce07d545b37bb545ffd71b3aa  build/compat135/public.apk' | sha256sum --check
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' 'emulator' 'system-images;android-${{ matrix.api }};google_apis;x86_64'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs build/compat135/public.apk > build/compat135/apk-signature.txt
          python3 - <<'PY'
          from pathlib import Path
          assert '2f0a0908f269bc039311edb58fca8863347f1e4c3a7cfaddd909991cf1f0b509' in Path('build/compat135/apk-signature.txt').read_text()
          PY
      - name: Create one fresh accelerated device
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name recovery134 --package 'system-images;android-${{ matrix.api }};google_apis;x86_64' --device pixel_2
      - name: Exercise published APK offline and collect bounded measurements
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/run_android_emulator.py --out build/compat135/emulator --timeout 480 -- /usr/bin/python3 tools/check_published135_compat.py --apk build/compat135/public.apk --out build/compat135/proof --expected-api ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published135-api${{ matrix.api }}-proof
          path: |
            build/compat135/apk-signature.txt
            build/compat135/proof/
            build/compat135/emulator/
          if-no-files-found: error
          retention-days: 30
