name: Build optional models and update notifications 0.3.139
on:
  push:
    branches: ['release/optional-3d-0.3.139']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: optional-models-139-build-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_SIGNING_KEYSTORE: ${{ github.workspace }}/models139-existing.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare metadata without bundling geometry
        run: python3 tools/prepare_optional_models139.py
      - name: Restore existing signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,os,subprocess
          from pathlib import Path
          p=Path(os.environ['CI_SIGNING_KEYSTORE'])
          p.write_bytes(base64.b64decode(''.join(os.environ['ANDROID_DEBUG_KEYSTORE_BASE64'].split()),validate=True));p.chmod(0o600)
          cert=subprocess.run(['keytool','-exportcert','-keystore',str(p),'-storepass','android','-alias','androiddebugkey'],check=True,capture_output=True).stdout
          assert hashlib.sha256(cert).hexdigest()=='2f0a0908f269bc039311edb58fca8863347f1e4c3a7cfaddd909991cf1f0b509'
          PY
      - name: Compile, run unit tests, and sign small APKs
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon --max-workers=2 -PciSigningKeystore="$CI_SIGNING_KEYSTORE"
          python3 tools/verify_optional_apk139.py
      - uses: actions/upload-artifact@v4
        with:
          name: optional-models-139-apks
          path: build/models139/apks/
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-models-139-reports
          path: app/build/reports/
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: python3 -c "import os,pathlib;pathlib.Path(os.environ['CI_SIGNING_KEYSTORE']).unlink(missing_ok=True)"

  android:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    env:
      GH_TOKEN: ${{ github.token }}
      ANDROID_AVD_HOME: ${{ github.workspace }}/build/android-avds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: optional-models-139-apks
          path: build/models139/apks
      - name: Fetch immutable prior release and model fixture
        run: |
          set -euo pipefail
          mkdir -p build/models139/inputs
          gh release download app-0.3.138 --pattern DLYA_SVOIH_v0.3.138.apk --dir build/models139/inputs
          if [ '${{ matrix.api }}' = '26' ]; then
            gh release download models-pack-1 --pattern models-615-v1.zip --dir build/models139/inputs
            echo '7780860bcb82fc23a861f162a66d99fb8950a66508275919ee7bf9c1b6b9147d  build/models139/inputs/models-615-v1.zip' | sha256sum -c -
          fi
      - name: Prepare accelerated Android device
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-${{ matrix.api }};google_apis;x86_64'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name recovery134 --package 'system-images;android-${{ matrix.api }};google_apis;x86_64' --device pixel_2
          python3 - <<'PYAVD'
          import os
          from pathlib import Path
          p=Path(os.environ['ANDROID_AVD_HOME'])/'recovery134.avd/config.ini'
          values=dict(line.split('=',1) for line in p.read_text().splitlines() if '=' in line)
          values.update({'hw.lcd.width':'720','hw.lcd.height':'1280','hw.lcd.density':'320','disk.dataPartition.size':'8G'})
          p.write_text('\n'.join(k+'='+v for k,v in values.items())+'\n')
          PYAVD
      - name: Verify signed upgrade, optional storage, and notifications
        run: |
          set -euo pipefail
          pack_args=()
          if [ '${{ matrix.api }}' = '26' ]; then pack_args=(--pack build/models139/inputs/models-615-v1.zip); fi
          python3 tools/run_android_emulator.py --out build/models139/emulator --timeout 2800 -- python3 tools/check139_android.py --api '${{ matrix.api }}' --apks build/models139/apks --previous build/models139/inputs/DLYA_SVOIH_v0.3.138.apk --out build/models139/proof "${pack_args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-models-139-api${{ matrix.api }}
          path: |
            build/models139/proof/
            build/models139/emulator/
          retention-days: 14
