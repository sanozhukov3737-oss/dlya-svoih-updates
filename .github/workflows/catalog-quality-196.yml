name: Verify and publish catalog quality update 196

on:
  push:
    branches: ['main']
    paths: ['docs/releases/catalog-quality-196.json', '.github/workflows/catalog-quality-196.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-app
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ANDROID_AVD_HOME: ${{ github.workspace }}/build/android-avds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preserve exact baseline and apply reviewed corrections
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          mkdir -p build/catalog196 app/src/androidTest/assets
          cp content/catalog.json build/catalog196/baseline.json
          cp app/src/main/assets/database/guide-v29.db app/src/androidTest/assets/quality196-baseline.db
          /usr/bin/python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          request=json.loads(Path('docs/releases/catalog-quality-196.json').read_text())
          for path,key in [('content/catalog.json','baseCatalogSha256'),('app/src/main/assets/database/guide-v29.db','baseDatabaseSha256')]:
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==request[key], path
          PY
          /usr/bin/python3 tools/audit_card_quality.py --database app/src/main/assets/database/guide-v29.db --report research/catalog-quality-196/before.json
          /usr/bin/python3 tools/apply_card_quality_196.py
          /usr/bin/python3 tools/build_catalog.py
          /usr/bin/python3 tools/audit_card_quality.py --database app/src/main/assets/database/guide-v29.db --report research/catalog-quality-196/after.json
          /usr/bin/python3 tools/verify_card_quality_196.py --baseline build/catalog196/baseline.json > build/catalog196/preservation.json
      - name: Verify current catalog and reader behavior
        run: |
          set -euo pipefail
          for check in test_updates.py test_uav_handbook.py test_demz_catalog.py test_java_features.py test_reader_navigation.py test_search.py; do
            /usr/bin/python3 -m unittest discover -s tools -p "$check"
          done
      - name: Prepare full update and preserve the installed APK offer
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 90 'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/latest/download/latest.json' --output build/catalog196/latest-before.json
          /usr/bin/python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from pack_restored_catalog import make_pack
          from build_update_feed import write_feed
          out=Path('build/catalog196')
          request=json.loads(Path('docs/releases/catalog-quality-196.json').read_text())
          previous=json.loads((out/'latest-before.json').read_text())
          assert previous['contentVersion']==195
          assert previous['app']['versionCode']==138
          pack=out/'catalog-196.zip'
          result=make_pack('app/src/main/assets',pack,196,request['cards'],request['images'])
          feed=write_feed(pack,'https://github.com/sanozhukov3737-oss/dlya-svoih-updates/releases/download/catalog-196/catalog-196.zip',out/'latest.json',request['changes'],138,out/'latest-before.json')
          assert feed['app']==previous['app']
          (out/'package-verification.json').write_text(json.dumps(result,indent=2)+'\n')
          (out/'notes.txt').write_text(request['changes']+'\n\nПроверены целостность базы, поиск и импорт полного пакета на Android 11. Сохранённые карточки и место чтения проверены при удалении дубля и после повторного открытия базы. Медицинские тексты и 3D-модели не изменялись.\n')
          PY
          cp build/catalog196/catalog-196.zip app/src/androidTest/assets/quality196-pack.zip
      - name: Compile regression tests and prepare Android
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-30;google_apis;x86_64'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name recovery134 --package 'system-images;android-30;google_apis;x86_64' --device pixel_2
      - name: Import actual ZIP over public catalog 195 on Android 11
        run: |
          python3 tools/run_android_emulator.py --out build/catalog196/emulator --timeout 900 -- bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.dlyasvoih.app.CatalogQuality196Test --no-daemon
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected/debug').glob('TEST-*.xml'))
          assert files, 'Missing Android reports'
          suites=[ET.parse(p).getroot() for p in files]
          assert sum(int(s.attrib['tests']) for s in suites)==2
          assert sum(int(s.attrib.get(k,0)) for s in suites for k in ('failures','errors','skipped'))==0
          PY
      - name: Commit verified generated source and database
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/catalog.json app/src/main/assets/database/guide-v29.db app/src/main/assets/database/content-version.txt research/catalog-quality-196/before.json research/catalog-quality-196/after.json research/catalog-quality-196/changes.json research/catalog-quality-196/withdrawn-card.json
          git commit -m 'Apply verified catalog 196 corrections and preserve saved cards'
          git push origin HEAD:main
      - name: Upload and verify release before opening update channel
        run: |
          set -euo pipefail
          gh release create catalog-196 build/catalog196/catalog-196.zip build/catalog196/latest.json build/catalog196/package-verification.json build/catalog196/preservation.json --draft --target "$(git rev-parse HEAD)" --title 'ДЛЯ СВОИХ — каталог №196' --notes-file build/catalog196/notes.txt
          mkdir -p build/catalog196/download-check
          gh release download catalog-196 --pattern catalog-196.zip --pattern latest.json --dir build/catalog196/download-check
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('build/catalog196'); check=root/'download-check'
          feed=json.loads((check/'latest.json').read_text())
          pack=check/'catalog-196.zip'
          assert pack.read_bytes()==(root/'catalog-196.zip').read_bytes()
          assert pack.stat().st_size==feed['bytes']
          assert hashlib.sha256(pack.read_bytes()).hexdigest()==feed['sha256']
          assert (check/'latest.json').read_bytes()==(root/'latest.json').read_bytes()
          assert feed['app']==json.loads((root/'latest-before.json').read_text())['app']
          PY
          gh release edit catalog-196 --draft=false --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog196-quality-and-android-proof
          path: |
            build/catalog196/
            research/catalog-quality-196/
            app/build/outputs/androidTest-results/connected/debug/
          retention-days: 30
